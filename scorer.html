<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Article AI-Readiness Scorer</title>
<style>
:root{
  --bg:#f7f7f5; --card:#ffffff; --border:#e2e0da; --text:#1f2a3d; --muted:#666358;
  --accent:#185fa5; --good:#3b6d11; --warn:#854f0b; --bad:#a32d2d;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --card:#1c2027; --border:#2c313a; --text:#e8e8e6; --muted:#9a9a94;
    --accent:#7fb0e8; --good:#8fce6a; --warn:#f0c37a; --bad:#f0a3a3;
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --card:#1c2027; --border:#2c313a; --text:#e8e8e6; --muted:#9a9a94;
  --accent:#7fb0e8; --good:#8fce6a; --warn:#f0c37a; --bad:#f0a3a3;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
.wrap{max-width:760px;margin:0 auto;padding:2rem 1.25rem 3rem;}
h1{font-size:1.4rem;font-weight:600;margin:0 0 .3rem;}
p.sub{color:var(--muted);font-size:.95rem;margin:0 0 1.5rem;line-height:1.5;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
label{display:block;font-size:.85rem;font-weight:600;margin:0 0 .3rem;color:var(--muted);}
input,textarea{width:100%;padding:.6rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.95rem;font-family:inherit;margin-bottom:1rem;}
textarea{min-height:180px;resize:vertical;line-height:1.5;}
.row{display:flex;gap:1rem;flex-wrap:wrap;}
.row > div{flex:1;min-width:160px;}
button{background:var(--accent);color:#fff;border:none;padding:.7rem 1.4rem;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;}
button:active{opacity:.85;}
.err{color:var(--bad);font-size:.85rem;margin:-.6rem 0 1rem;display:none;}
#results{display:none;}
.score-hero{text-align:center;padding:1.5rem 1rem;}
.score-num{font-size:3rem;font-weight:700;line-height:1;}
.score-label{color:var(--muted);font-size:.9rem;margin-top:.3rem;}
.cat{border-top:1px solid var(--border);padding:.9rem 0;}
.cat:first-child{border-top:none;}
.cat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;}
.cat-name{font-weight:600;font-size:.95rem;}
.cat-score{font-weight:600;font-size:.9rem;}
.bar-bg{background:var(--border);border-radius:6px;height:6px;overflow:hidden;margin-bottom:.5rem;}
.bar-fill{height:100%;border-radius:6px;}
.cat-note{color:var(--muted);font-size:.85rem;line-height:1.45;overflow-x:auto;}
.good{color:var(--good);} .warn{color:var(--warn);} .bad{color:var(--bad);}
.bar-good{background:var(--good);} .bar-warn{background:var(--warn);} .bar-bad{background:var(--bad);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Knowledge article AI-readiness scorer</h1>
  <p class="sub">Paste a knowledge base article below to score it against the AI-readiness criteria: clarity, structure, metadata, ownership, review currency, and retrievability.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="title">Article title</label>
        <input id="title" type="text" placeholder="e.g. How to reset a locked ServiceNow account" />
      </div>
      <div>
        <label for="owner">Content owner</label>
        <input id="owner" type="text" placeholder="e.g. Service Desk Team" />
      </div>
    </div>
    <div class="row">
      <div>
        <label for="reviewed">Last reviewed date</label>
        <input id="reviewed" type="date" />
      </div>
    </div>
    <label for="content">Article content</label>
    <textarea id="content" placeholder="Paste the full article text here..."></textarea>
    <div class="err" id="err">Paste some article content before scoring.</div>
    <button onclick="scoreArticle()">Score this article</button>
  </div>

  <div id="results"></div>
</div>

<script>
function scoreArticle(){
  const title = document.getElementById('title').value.trim();
  const owner = document.getElementById('owner').value.trim();
  const reviewed = document.getElementById('reviewed').value;
  const content = document.getElementById('content').value.trim();
  const err = document.getElementById('err');

  if(!content){ err.style.display='block'; return; }
  err.style.display='none';

  const results = [];

  // Clarity: avg sentence length
  const sentences = content.split(/[.!?]+/).filter(s=>s.trim().length>3);
  const words = content.split(/\s+/).filter(Boolean);
  const avgSentLen = sentences.length ? words.length/sentences.length : words.length;
  let clarityScore, clarityNote;
  if(avgSentLen <= 20){ clarityScore=90; clarityNote='Sentences average '+Math.round(avgSentLen)+' words — easy to parse for both readers and AI. (Note: this is a simple sentence-length proxy, not a full clarity/readability measure.)'; }
  else if(avgSentLen <= 30){ clarityScore=65; clarityNote='Sentences average '+Math.round(avgSentLen)+' words. Consider shortening for clearer extraction. (Simple sentence-length proxy, not full readability analysis.)'; }
  else{ clarityScore=35; clarityNote='Sentences average '+Math.round(avgSentLen)+' words — too long. Break into shorter, single-idea sentences. (Simple sentence-length proxy, not full readability analysis.)'; }
  results.push({name:'Clarity (sentence-length proxy)', score:clarityScore, note:clarityNote});

  // Structure: headings/bullets/numbered steps/paragraph organization
  // Use multiline mode (^ matches start of every line, not just after a literal \n)
  // so the first line of a list is counted too.
  const bulletLines = (content.match(/^\s*[-*•]\s/gm)||[]).length;
  const numberedLines = (content.match(/^\s*\d+[.)]\s/gm)||[]).length;
  const markdownHeadings = (content.match(/^\s*#{1,6}\s/gm)||[]).length;
  // Short standalone lines (e.g. "Overview", "Prerequisites:") often act as headings
  // even without markdown syntax — a short line (<=6 words) on its own line.
  const shortLineHeadings = (content.match(/^\s*[A-Z][A-Za-z0-9 /&-]{1,40}:?\s*$/gm)||[]).length;
  // Paragraph breaks (blank line between blocks) indicate the writer separated ideas into sections.
  const paragraphBlocks = content.split(/\n\s*\n/).filter(p=>p.trim().length>0).length;

  const listSignals = bulletLines + numberedLines;
  const headingSignals = markdownHeadings + shortLineHeadings;

  let structScore, structNote;
  const signalParts = [];
  if(listSignals>0) signalParts.push(listSignals+' list item(s)');
  if(headingSignals>0) signalParts.push(headingSignals+' heading-like line(s)');
  if(paragraphBlocks>=3) signalParts.push(paragraphBlocks+' distinct paragraph blocks');

  if(listSignals>=3 || headingSignals>=1){
    structScore=90;
    structNote='Well structured — detected '+(signalParts.join(', ')||'clear organization')+'. Easy for both readers and AI to segment.';
  } else if(listSignals>=1 || paragraphBlocks>=3){
    structScore=60;
    structNote='Some structure present ('+(signalParts.join(', ')||'a few organizational cues')+'), but could use more headings or steps to fully segment the content.';
  } else {
    structScore=25;
    structNote='No headings, bullets, numbered steps, or clear paragraph breaks detected — hard for AI to segment into usable chunks.';
  }
  results.push({name:'Structure', score:structScore, note:structNote});

  // Metadata: owner + review date filled
  let metaScore=0, metaNotes=[];
  if(owner){ metaScore+=50; } else { metaNotes.push('no owner listed'); }
  if(reviewed){ metaScore+=50; } else { metaNotes.push('no last-reviewed date'); }
  const metaNote = metaNotes.length ? 'Missing: '+metaNotes.join(', ')+'.' : 'Owner and review date both present — clear accountability.';
  results.push({name:'Metadata & ownership', score:metaScore, note:metaNote});

  // Review currency
  let reviewScore, reviewNote;
  if(!reviewed){ reviewScore=20; reviewNote='No review date set — cannot verify currency. AI cannot judge if this content is stale.'; }
  else{
    const days = (Date.now() - new Date(reviewed).getTime())/(1000*3600*24);
    if(days <= 365){ reviewScore=90; reviewNote='Reviewed within the last 12 months — current.'; }
    else if(days <= 730){ reviewScore=55; reviewNote='Last reviewed 1-2 years ago — due for a refresh.'; }
    else{ reviewScore=20; reviewNote='Last reviewed over 2 years ago — high risk of stale or inaccurate content.'; }
  }
  results.push({name:'Review currency', score:reviewScore, note:reviewNote});

  // Context: applicability / prerequisite cues
  const contextCues = /(applies to|prerequisite|related to|before you|note:|scope|limitation)/i.test(content);
  const contextScore = contextCues ? 80 : 35;
  const contextNote = contextCues
    ? 'Article gives some applicability or prerequisite context — helps AI and readers judge relevance.'
    : 'No scope, prerequisite, or applicability cues found. Add a short "applies to" or "before you start" note.';
  results.push({name:'Context', score:contextScore, note:contextNote});

  // Retrievability: title quality
  const titleWords = title.split(/\s+/).filter(Boolean).length;
  let retrScore, retrNote;
  if(!title){ retrScore=15; retrNote='No title provided — titles are the primary retrieval signal for both search and AI.'; }
  else if(titleWords>=4 && titleWords<=12){ retrScore=85; retrNote='Title length ('+titleWords+' words) is descriptive without being vague or bloated.'; }
  else if(titleWords<4){ retrScore=45; retrNote='Title is quite short ('+titleWords+' words) — may be too vague for accurate retrieval.'; }
  else{ retrScore=50; retrNote='Title is long ('+titleWords+' words) — consider tightening for clearer indexing.'; }
  results.push({name:'Retrievability', score:retrScore, note:retrNote});

  const overall = Math.round(results.reduce((a,r)=>a+r.score,0)/results.length);

  renderResults(overall, results);
}

function tier(score){
  if(score>=75) return {cls:'good', bar:'bar-good'};
  if(score>=45) return {cls:'warn', bar:'bar-warn'};
  return {cls:'bad', bar:'bar-bad'};
}

function renderResults(overall, results){
  const t = tier(overall);
  let html = '<div class="card score-hero">';
  html += '<div class="score-num '+t.cls+'">'+overall+'<span style="font-size:1.2rem;color:var(--muted);">/100</span></div>';
  html += '<div class="score-label">AI-readiness score</div>';
  html += '</div>';
  html += '<div class="card">';
  results.forEach(r=>{
    const rt = tier(r.score);
    html += '<div class="cat">';
    html += '<div class="cat-head"><span class="cat-name">'+r.name+'</span><span class="cat-score '+rt.cls+'">'+r.score+'/100</span></div>';
    html += '<div class="bar-bg"><div class="bar-fill '+rt.bar+'" style="width:'+r.score+'%;"></div></div>';
    html += '<div class="cat-note">'+r.note+'</div>';
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('results').innerHTML = html;
  document.getElementById('results').style.display = 'block';
}
</script>
</body>
</html>
